name: Apply prepared clock-shift announcement

on:
  push:
    branches: [fix/clock-shift-live-region]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply the verified patch
        run: |
          set -euo pipefail
          base64 -d .github/live.patch.gz.b64 | gunzip > /tmp/change.patch
          echo '5e21a479ff284fbaeac66c5b03dac1f9ba0f5148697be75a61e3fe30f3e30e16  /tmp/change.patch' | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git add -A
          git rm .github/live.patch.gz.b64 .github/workflows/apply-live-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Announce clock-shift warnings with a polite live region'
          git push
