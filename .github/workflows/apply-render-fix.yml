name: Apply prepared render-warning change

on:
  push:
    branches: [fix/rendered-clock-warnings]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply the verified patch
        run: |
          set -euo pipefail
          base64 -d .github/render.patch.gz.b64 | gunzip > /tmp/change.patch
          echo '2f6bac8e1ce82908bfb1c794c805d73c067be3e3c96b9b14a6f04cbbdc90f829  /tmp/change.patch' | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git add -A
          git rm .github/render.patch.gz.b64 .github/workflows/apply-render-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prove clock-shift warnings reach the rendered chart'
          git push
