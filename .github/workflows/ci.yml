name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      # Boots dist/web_app/index.js in workerd with the deployed bindings, so
      # the real entrypoint and @freebuff/auth routes are covered, not just the
      # app factory the unit tests import.
      - name: Worker smoke test
        run: bun run smoke:worker
