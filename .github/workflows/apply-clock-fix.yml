name: Apply prepared clock-time fix

on:
  push:
    branches: [fix/ambiguous-clock-times]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply the verified patch
        run: |
          set -euo pipefail
          git show d9e49c1148ef68b729593fc414506173bf4e5090:.github/change.patch.gz.b64 \
            | base64 -d | gunzip > /tmp/change.patch
          echo 'b8d5e1f5ec89ca50366034ca4b18a876813efb5b0b5e4e0407a9ebfbec29f3a4  /tmp/change.patch' | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git add -A
          git rm .github/workflows/apply-clock-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve clock times a time-zone change repeats or skips'
          git push
