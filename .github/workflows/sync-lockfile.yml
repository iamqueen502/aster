name: Sync lockfile

on:
  push:
    branches: [test/progress-restore-regression]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install
      - name: Commit a changed lockfile
        run: |
          if [ -z "$(git status --porcelain bun.lock)" ]; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh bun.lock for the rendered test"
          git push
