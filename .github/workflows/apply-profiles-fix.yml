name: Apply prepared chart-list error change

on:
  push:
    branches: [fix/profiles-load-error]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply the verified patch
        run: |
          set -euo pipefail
          base64 -d .github/profiles.patch.gz.b64 | gunzip > /tmp/change.patch
          echo '5767696752bdb933213bc3e3eecbfdc81708d724cd4bb4c81bb6fe3394791885  /tmp/change.patch' | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git add -A
          git rm .github/profiles.patch.gz.b64 .github/workflows/apply-profiles-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Surface a failed chart list instead of showing an empty account'
          git push
