name: assemble-lockfile

on:
  push:
    branches: [ci/pin-lockfile]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble bun.lock from slices
        run: |
          for i in 01 02 03 04 05; do
            test -f ".locksplit/$i" || { echo "missing .locksplit/$i"; exit 1; }
          done
          cat .locksplit/01 .locksplit/02 .locksplit/03 .locksplit/04 .locksplit/05 > bun.lock
          wc -c bun.lock
          sha256sum bun.lock
          echo "829f444fda5f7f0be9af311108c983e8a07a1426a43a13cb3e6639d2886d498d  bun.lock" | sha256sum -c -
      - name: Commit the lockfile and drop the staging files
        run: |
          git rm -r -q .locksplit
          git rm -q .github/workflows/assemble-lockfile.yml
          git add bun.lock
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add bun.lock assembled from verified slices"
          git push
